<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Rainy</title>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fcf9f5;
            color: #4a4238;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 30px;
            text-align: center;
            position: relative;
        }

        /* Audio Player Section */
        .audio-player-box {
            background: #f4efe6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .audio-info {
            font-size: 14px;
            color: #5c5042;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e8dcc4;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #a8937e;
            transition: width 0.1s linear;
        }

        .audio-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .audio-btn {
            background: #e8dcc4;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.3s;
        }

        .audio-btn:hover {
            background: #dfcfb2;
        }

        /* Slideshow Section with Zoom Capability */
        .slideshow-container {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
            margin-bottom: 15px;
            touch-action: none;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }

        .slide img:active {
            cursor: grabbing;
        }

        /* Download Button */
        .download-btn-container {
            margin-bottom: 20px;
        }

        .download-btn {
            background: #e8dcc4;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #dfcfb2;
        }

        /* Narrative Caption */
        .caption-box {
            min-height: 80px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
        }

        .caption-text {
            font-size: 16px;
            color: #6b5e50;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            flex: 1;
            background: #f4efe6;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: #e8dcc4;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Footer message */
        .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: #9c8e7e;
            border-top: 1px solid #f0ebe1;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ระบบเสียงบรรยายพร้อมแถบเวลา -->
        <div class="audio-player-box">
            <div class="audio-info">
                <span>🎙️ เสียงบรรยายความรู้สึก</span>
                <span id="timeDisplay">0:00 / 0:00</span>
            </div>
            <div class="progress-bar-container" id="progressBarContainer" onclick="seekAudio(event)">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="audio-controls">
                <button class="audio-btn" onclick="rewindAudio()">⏪ ย้อนกลับ 5 วินาที</button>
            </div>
        </div>

        <!-- พื้นที่แสดงรูปภาพสไลด์โชว์ -->
        <div class="slideshow-container" id="slideshow">
            <div class="slide active"><img src="pic0.jpeg" alt="Memory 0"></div>
            <div class="slide"><img src="pic1.jpeg" alt="Memory 1"></div>
            <div class="slide"><img src="pic2.png" alt="Memory 2"></div>
            <div class="slide"><img src="pic3.png" alt="Memory 3"></div>
            <div class="slide"><img src="pic4.jpeg" alt="Memory 4"></div>
            <div class="slide"><img src="pic5.jpeg" alt="Memory 5"></div>
            <div class="slide"><img src="pic6.png" alt="Memory 6"></div>
            <div class="slide"><img src="pic7.jpeg" alt="Memory 7"></div>
            <div class="slide"><img src="pic8.jpeg" alt="Memory 8"></div>
            <div class="slide"><img src="pic9.jpeg" alt="Memory 9"></div>
            <div class="slide"><img src="pic10.jpeg" alt="Memory 10"></div>
            <div class="slide"><img src="pic11.jpeg" alt="Memory 11"></div>
            <div class="slide"><img src="pic12.png" alt="Memory 12"></div>
            <div class="slide"><img src="pic13.jpeg" alt="Memory 13"></div>
            <div class="slide"><img src="pic14.jpeg" alt="Memory 14"></div>
            <div class="slide"><img src="pic15.jpeg" alt="Memory 15"></div>
            <div class="slide"><img src="pic16.jpeg" alt="Memory 16"></div>
            <div class="slide"><img src="pic17.jpeg" alt="Memory 17"></div>
            <div class="slide"><img src="pic18.jpeg" alt="Memory 18"></div>
            <div class="slide"><img src="pic19.jpeg" alt="Memory 19"></div>
            <div class="slide"><img src="pic20.jpeg" alt="Memory 20"></div>
            <div class="slide"><img src="pic21.jpeg" alt="Memory 21"></div>
            <div class="slide"><img src="pic22.jpeg" alt="Memory 22"></div>
            <div class="slide"><img src="pic23.jpeg" alt="Memory 23"></div>
            <div class="slide"><img src="pic24.jpeg" alt="Memory 24"></div>
            <div class="slide"><img src="pic25.jpeg" alt="Memory 25"></div>
            <div class="slide"><img src="pic26.jpeg" alt="Memory 26"></div>
            <div class="slide"><img src="pic27.jpeg" alt="Memory 27"></div>
            <div class="slide"><img src="pic28.jpeg" alt="Memory 28"></div>
            <div class="slide"><img src="pic29.png" alt="Memory 29"></div>
            <div class="slide"><img src="pic30.jpeg" alt="Memory 30"></div>
            <div class="slide"><img src="pic31.jpeg" alt="Memory 31"></div>
            <div class="slide"><img src="pic32.png" alt="Memory 32"></div>
        </div>

        <!-- ปุ่มดาวน์โหลดรูปปัจจุบัน -->
        <div class="download-btn-container">
            <button class="download-btn" onclick="downloadCurrentPhoto()">📥 ดาวน์โหลดรูปภาพนี้</button>
        </div>

        <!-- กล่องข้อความบรรยายความรู้สึก -->
        <div class="caption-box">
            <p class="caption-text" id="captionText"></p>
        </div>

        <!-- ปุ่มกดเปลี่ยนรูป -->
        <div class="nav-buttons">
            <button class="btn" id="prevBtn" onclick="changeSlide(-1)" disabled>◀ รูปก่อนหน้า</button>
            <button class="btn" id="nextBtn" onclick="changeSlide(1)">รูปถัดไป ▶</button>
        </div>

        <div class="footer-note">
            HBD Rainy • Wishing you all the best and genuine happiness.
        </div>
    </div>

    <!-- ไฟล์เสียงบรรยาย -->
    <audio id="bgVoice" autoplay loop preload="auto">
        <source src="song.mp3" type="audio/mp3">
    </audio>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.getElementById('prevBtn');
        
        const captions = [
            "สุขสันต์วันเกิดนะเรนนี่... ขอบคุณสำหรับทุกความทรงจำที่ดีตลอดมา",
            "ทุกเรื่องราวที่เราเคยมีร่วมกัน ยังคงเป็นความประทับใจในใจเสมอ",
            "ไม่ว่าเวลาจะผ่านไปนานแค่ไหน เรื่องราวเหล่านี้ก็ยังมีค่าเสมอ",
            "ขอให้เธอมีความสุขมากๆ ในทุกๆ วันและทุกเส้นทางที่เดินไป",
            "ขอให้เป็นปีที่ดีและเต็มไปด้วยรอยยิ้มนะ",
            "", "", "", "", "", "", "", "", "", "", 
            "", "", "", "", "", "", "", "", "", "", 
            "", "", "", "", "", "", "", "", "", "", 
            "", "", 
            "ขอให้มีความสุขมากๆ ในวันนี้นะ"
        ];

        const captionElement = document.getElementById('captionText');

        function resetZoom(img) {
            img.style.transform = "scale(1) translate(0px, 0px)";
            scale = 1;
            pannedX = 0;
            pannedY = 0;
        }

        function updateSlide() {
            slides.forEach((slide, index) => {
                const img = slide.querySelector('img');
                if (img) resetZoom(img);

                slide.classList.remove('active');
                if (index === currentSlide) {
                    slide.classList.add('active');
                }
            });

            captionElement.textContent = captions[currentSlide] || "";

            if (currentSlide === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide >= slides.length) {
                currentSlide = slides.length - 1;
            } else if (currentSlide < 0) {
                currentSlide = 0;
            }
            updateSlide();
        }

        function downloadCurrentPhoto() {
            const activeSlideImg = slides[currentSlide].querySelector('img');
            const imgSrc = activeSlideImg.src;
            
            const a = document.createElement('a');
            a.href = imgSrc;
            a.download = `Memory_${currentSlide}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        const audio = document.getElementById('bgVoice');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');

        window.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(e => console.log("Autoplay blocked"));
            }
        }, { once: true });

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration) {
                timeDisplay.textContent = formatTime(0) + ' / ' + formatTime(audio.duration);
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = progressPercent + '%';
                timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function rewindAudio() {
            audio.currentTime = Math.max(0, audio.currentTime - 5);
        }

        function seekAudio(event) {
            const container = document.getElementById('progressBarContainer');
            const clickPosition = event.offsetX / container.offsetWidth;
            if (audio.duration) {
                audio.currentTime = clickPosition * audio.duration;
            }
        }

        let scale = 1;
        let pannedX = 0, pannedY = 0;
        let startX = 0, startY = 0;
        let isDragging = false;
        let initialDistance = null;

        slides.forEach(slide => {
            const img = slide.querySelector('img');
            if (!img) return;

            img.addEventListener('mousedown', (e) => {
                if (scale > 1) {
                    isDragging = true;
                    startX = e.clientX - pannedX;
                    startY = e.clientY - pannedY;
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                pannedX = e.clientX - startX;
                pannedY = e.clientY - startY;
                updateTransform(img);
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            img.addEventListener('dblclick', (e) => {
                if (scale === 1) {
                    scale = 2.5;
                } else {
                    scale = 1;
                    pannedX = 0;
                    pannedY = 0;
                }
                updateTransform(img);
            });

            img.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && scale > 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - pannedX;
                    startY = e.touches[0].clientY - pannedY;
                } else if (e.touches.length === 2) {
                    initialDistance = getHypot(e.touches[0], e.touches[1]);
                }
            }, { passive: true });

            img.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isDragging) {
                    pannedX = e.touches[0].clientX - startX;
                    pannedY = e.touches[0].clientY - startY;
                    updateTransform(img);
                } else if (e.touches.length === 2 && initialDistance) {
                    const currentDistance = getHypot(e.touches[0], e.touches[1]);
                    const zoomFactor = currentDistance / initialDistance;
                    scale = Math.min(Math.max(1, scale * (zoomFactor * 0.05 + 0.95)), 4);
                    initialDistance = currentDistance;
                    updateTransform(img);
                }
            }, { passive: true });

            img.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) initialDistance = null;
                if (e.touches.length === 0) isDragging = false;
            });
        });

        function getHypot(t1, t2) {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function updateTransform(img) {
            img.style.transform = `scale(${scale}) translate(${pannedX / scale}px, ${pannedY / scale}px)`;
        }

        // เริ่มต้นแสดงผลรูปแรกและข้อความตั้งแต่เปิดเว็บ
        updateSlide();
    </script>

</body>
</html>
