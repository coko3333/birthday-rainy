<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Rainy</title>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fcf9f5;
            color: #4a4238;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 30px;
            text-align: center;
            position: relative;
        }

        /* Voice Note Section (เสียงบรรยาย: เล่นอัตโนมัติ ห้ามฟอร์เวิร์ด ย้อนได้ 5 วิ) */
        .voice-note-box {
            background: #f4efe6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .voice-title {
            font-size: 14px;
            color: #5c5042;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .voice-progress-container {
            width: 100%;
            height: 10px;
            background: #e8dcc4;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
            pointer-events: none; /* ห้ามกดเลื่อนไปข้างหน้า */
        }

        .voice-progress-bar {
            width: 0%;
            height: 100%;
            background: #a8937e;
        }

        /* Audio Player Section (เครื่องเล่นเพลงด้านล่าง: ปิดไว้ก่อนตอนแรก, ควบคุมอิสระ) */
        .audio-player-box {
            background: #f4efe6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .audio-info {
            font-size: 14px;
            color: #5c5042;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #e8dcc4;
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 12px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #a8937e;
            pointer-events: none;
        }

        .audio-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .audio-btn {
            background: #e8dcc4;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.3s;
        }

        .audio-btn:hover {
            background: #dfcfb2;
        }

        /* Playlist Section */
        .playlist-box {
            margin-top: 15px;
            border-top: 1px solid #e8dcc4;
            padding-top: 12px;
            text-align: left;
        }

        .playlist-title {
            font-size: 13px;
            color: #7a6a56;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }

        .playlist-item:hover {
            background: #eae2d0;
        }

        .playlist-item.active-song {
            background: #e2d4bc;
            font-weight: 500;
        }

        .song-dl-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            color: #5c5042;
            border-radius: 4px;
        }

        .song-dl-btn:hover {
            background: #d4c4ac;
        }

        /* Slideshow Section with Zoom Capability */
        .slideshow-container {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
            margin-bottom: 15px;
            touch-action: none;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }

        .slide img:active {
            cursor: grabbing;
        }

        /* Download Button */
        .download-btn-container {
            margin-bottom: 20px;
        }

        .download-btn {
            background: #e8dcc4;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #dfcfb2;
        }

        /* Narrative Caption */
        .caption-box {
            min-height: 80px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
        }

        .caption-text {
            font-size: 16px;
            color: #6b5e50;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            flex: 1;
            background: #f4efe6;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: #e8dcc4;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Footer message */
        .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: #9c8e7e;
            border-top: 1px solid #f0ebe1;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- พื้นที่แสดงรูปภาพสไลด์โชว์ -->
        <div class="slideshow-container" id="slideshow">
            <div class="slide active"><img src="pic0.jpeg" alt="Memory 0"></div>
            <div class="slide"><img src="pic1.jpeg" alt="Memory 1"></div>
            <div class="slide"><img src="pic2.png" alt="Memory 2"></div>
            <div class="slide"><img src="pic3.png" alt="Memory 3"></div>
            <div class="slide"><img src="pic4.jpeg" alt="Memory 4"></div>
            <div class="slide"><img src="pic5.jpeg" alt="Memory 5"></div>
            <div class="slide"><img src="pic6.png" alt="Memory 6"></div>
            <div class="slide"><img src="pic7.jpeg" alt="Memory 7"></div>
            <div class="slide"><img src="pic8.jpeg" alt="Memory 8"></div>
            <div class="slide"><img src="pic9.jpeg" alt="Memory 9"></div>
            <div class="slide"><img src="pic10.jpeg" alt="Memory 10"></div>
            <div class="slide"><img src="pic11.jpeg" alt="Memory 11"></div>
            <div class="slide"><img src="pic12.png" alt="Memory 12"></div>
            <div class="slide"><img src="pic13.jpeg" alt="Memory 13"></div>
            <div class="slide"><img src="pic14.jpeg" alt="Memory 14"></div>
            <div class="slide"><img src="pic15.jpeg" alt="Memory 15"></div>
            <div class="slide"><img src="pic16.jpeg" alt="Memory 16"></div>
            <div class="slide"><img src="pic17.jpeg" alt="Memory 17"></div>
            <div class="slide"><img src="pic18.jpeg" alt="Memory 18"></div>
            <div class="slide"><img src="pic19.jpeg" alt="Memory 19"></div>
            <div class="slide"><img src="pic20.jpeg" alt="Memory 20"></div>
            <div class="slide"><img src="pic21.jpeg" alt="Memory 21"></div>
            <div class="slide"><img src="pic22.jpeg" alt="Memory 22"></div>
            <div class="slide"><img src="pic23.jpeg" alt="Memory 23"></div>
            <div class="slide"><img src="pic24.jpeg" alt="Memory 24"></div>
            <div class="slide"><img src="pic25.jpeg" alt="Memory 25"></div>
            <div class="slide"><img src="pic26.jpeg" alt="Memory 26"></div>
            <div class="slide"><img src="pic27.jpeg" alt="Memory 27"></div>
            <div class="slide"><img src="pic28.png" alt="Memory 28"></div>
            <div class="slide"><img src="pic29.jpeg" alt="Memory 29"></div>
            <div class="slide"><img src="pic30.jpeg" alt="Memory 30"></div>
            <div class="slide"><img src="pic31.jpeg" alt="Memory 31"></div>
            <div class="slide"><img src="pic32.png" alt="Memory 32"></div>
        </div>

        <!-- ปุ่มดาวน์โหลดรูปปัจจุบัน -->
        <div class="download-btn-container">
            <button class="download-btn" onclick="downloadCurrentPhoto()">📥 ดาวน์โหลดรูปภาพนี้</button>
        </div>

        <!-- กล่องข้อความบรรยายความรู้สึก -->
        <div class="caption-box">
            <p class="caption-text" id="captionText"></p>
        </div>

        <!-- ปุ่มกดเปลี่ยนรูป -->
        <div class="nav-buttons">
            <button class="btn" id="prevBtn" onclick="changeSlide(-1)" disabled>◀ รูปก่อนหน้า</button>
            <button class="btn" id="nextBtn" onclick="changeSlide(1)">รูปถัดไป ▶</button>
        </div>

        <!-- 🎙️ ส่วนเสียงบรรยาย (เปิดเว็บเล่นทันทีอัตโนมัติ, ห้ามหยุด/ห้ามฟอร์เวิร์ด, ย้อนกลับได้ 5 วิ) -->
        <div class="voice-note-box">
            <div class="voice-title">🎙️ เสียงความรู้สึกจากใจ</div>
            <div class="audio-info">
                <span>กำลังเล่นบรรยาย</span>
                <span id="voiceTimeDisplay">0:00 / 0:00</span>
            </div>
            <div class="voice-progress-container">
                <div class="voice-progress-bar" id="voiceProgressBar"></div>
            </div>
            <div class="audio-controls">
                <button class="audio-btn" onclick="rewindVoice()">⏪ ย้อนกลับ 5 วินาที</button>
            </div>
        </div>

        <!-- 🎵 ส่วนเครื่องเล่นเพลงและ Playlist (ด้านล่าง: ปิดไว้ก่อนตอนแรก, เลื่อน/กดเล่นได้อิสระทีหลัง) -->
        <div class="audio-player-box">
            <div class="audio-info">
                <span id="currentSongTitle">🎵 เพลงที่คุณร้อง (เลือกฟังด้านล่างได้เลย)</span>
                <span id="timeDisplay">0:00 / 0:00</span>
            </div>
            <div class="progress-bar-container" id="progressBarContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="audio-controls">
                <button class="audio-btn" onclick="prevSong()">⏮ เพลงก่อนหน้า</button>
                <button class="audio-btn" id="playPauseBtn" onclick="togglePlayPause()">▶ เล่นเพลง</button>
                <button class="audio-btn" onclick="nextSong()">เพลงถัดไป ⏭</button>
            </div>

            <div class="playlist-box">
                <div class="playlist-title">🎶 รายการเพลง (คลิกเพื่อฟังทีหลัง):</div>
                <div id="playlistContainer"></div>
            </div>
        </div>

        <div class="footer-note">
            HBD Rainy • Wishing you all the best and genuine happiness.
        </div>
    </div>

    <!-- Element สำหรับเล่นเสียง -->
    <audio id="voiceNote" src="voice.mp3" preload="auto"></audio>
    <audio id="bgVoice" preload="auto"></audio>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.getElementById('prevBtn');
        
        const captions = [
            "สุขสันต์วันเกิดนะเรนนี่... ขอบคุณสำหรับทุกความทรงจำที่ดีตลอดมา",
            "ทุกเรื่องราวที่เราเคยมีร่วมกัน ยังคงเป็นความประทับใจในใจเสมอ",
            "ไม่ว่าเวลาจะผ่านไปนานแค่ไหน เรื่องราวเหล่านี้ก็ยังมีค่าเสมอ",
            "ขอให้เธอมีความสุขมากๆ ในทุกๆ วันและทุกเส้นทางที่เดินไป",
            "ขอให้เป็นปีที่ดีและเต็มไปด้วยรอยยิ้มนะ",
            "", "", "", "", "", "", "", "", "", "", 
            "", "", "", "", "", "", "", "", "", "", 
            "", "", "", "", "", "", "", "", "", "", 
            "", "", 
            "ขอให้มีความสุขมากๆ ในวันนี้นะ"
        ];

        const captionElement = document.getElementById('captionText');

        function resetZoom(img) {
            img.style.transform = "scale(1) translate(0px, 0px)";
            scale = 1;
            pannedX = 0;
            pannedY = 0;
        }

        function updateSlide() {
            slides.forEach((slide, index) => {
                const img = slide.querySelector('img');
                if (img) resetZoom(img);

                slide.classList.remove('active');
                if (index === currentSlide) {
                    slide.classList.add('active');
                }
            });

            captionElement.textContent = captions[currentSlide] || "";

            if (currentSlide === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide >= slides.length) {
                currentSlide = slides.length - 1;
            } else if (currentSlide < 0) {
                currentSlide = 0;
            }
            updateSlide();
        }

        function downloadCurrentPhoto() {
            const activeSlideImg = slides[currentSlide].querySelector('img');
            const imgSrc = activeSlideImg.src;
            
            const a = document.createElement('a');
            a.href = imgSrc;
            a.download = `Memory_${currentSlide}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // --- ระบบเสียงบรรยาย (Voice Note: เล่นอัตโนมัติทันทีตอนเข้าเว็บ, ห้ามหยุด/ฟอร์เวิร์ด, ย้อนกลับได้ 5 วิ) ---
        const voiceNote = document.getElementById('voiceNote');
        const voiceProgressBar = document.getElementById('voiceProgressBar');
        const voiceTimeDisplay = document.getElementById('voiceTimeDisplay');

        window.addEventListener('load', () => {
            voiceNote.play().catch(e => {
                console.log("Auto-play blocked, waiting for user click");
                document.body.addEventListener('click', () => {
                    if (voiceNote.paused) {
                        voiceNote.play();
                    }
                }, { once: true });
            });
        });

        function rewindVoice() {
            voiceNote.currentTime = Math.max(0, voiceNote.currentTime - 5);
        }

        voiceNote.addEventListener('loadedmetadata', () => {
            if (voiceNote.duration) {
                voiceTimeDisplay.textContent = formatTime(0) + ' / ' + formatTime(voiceNote.duration);
            }
        });

        voiceNote.addEventListener('timeupdate', () => {
            if (voiceNote.duration) {
                const progressPercent = (voiceNote.currentTime / voiceNote.duration) * 100;
                voiceProgressBar.style.width = progressPercent + '%';
                voiceTimeDisplay.textContent = formatTime(voiceNote.currentTime) + ' / ' + formatTime(voiceNote.duration);
            }
        });


        // --- ระบบ Music Player & Playlist (ด้านล่าง: ปิดไว้ก่อนตอนแรก ให้กดฟังทีหลังได้อิสระ) ---
        const playlist = [
            { title: "เพลงที่ 1 (เสียงร้องของคุณ)", src: "music1.mp3" },
            { title: "เพลงที่ 2 (ความทรงจำของเรา)", src: "music2.mp3" },
            { title: "เพลงที่ 3 (สุขสันต์วันเกิด)", src: "music3.mp3" },
            { title: "เพลงที่ 4 (เพลงพิเศษสำหรับเธอ)", src: "music4.mp3" }
        ];

        let currentSongIndex = 0;
        const audio = document.getElementById('bgVoice');
        const progressBar = document.getElementById('progressBar');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        const currentSongTitle = document.getElementById('currentSongTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playlistContainer = document.getElementById('playlistContainer');
        let isSeekingSong = false;

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentSongIndex ? 'active-song' : ''}`;
                
                const songInfo = document.createElement('span');
                songInfo.style.flex = '1';
                songInfo.textContent = `${index + 1}. ${song.title}`;
                songInfo.onclick = () => {
                    loadSong(index);
                    audio.play();
                    updatePlayPauseButton();
                };

                const dlBtn = document.createElement('button');
                dlBtn.className = 'song-dl-btn';
                dlBtn.innerHTML = '📥 ดาวน์โหลด';
                dlBtn.title = 'ดาวน์โหลดเพลงนี้';
                dlBtn.onclick = (e) => {
                    e.stopPropagation();
                    const a = document.createElement('a');
                    a.href = song.src;
                    a.download = song.src;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                item.appendChild(songInfo);
                item.appendChild(dlBtn);
                playlistContainer.appendChild(item);
            });
        }

        function loadSong(index) {
            currentSongIndex = index;
            audio.src = playlist[currentSongIndex].src;
            currentSongTitle.textContent = `🎵 กำลังเล่น: ${playlist[currentSongIndex].title}`;
            renderPlaylist();
        }

        function togglePlayPause() {
            if (audio.paused) {
                // ถ้าเพลงยังไม่เคยถูกโหลดไฟล์ แอตทริบิวต์ src อาจจะว่าง ให้โหลดเพลงแรกก่อน
                if (!audio.src || audio.src === window.location.href) {
                    loadSong(0);
                }
                audio.play().catch(e => console.log("Play blocked"));
                playPauseBtn.textContent = "⏸ หยุดเพลง";
            } else {
                audio.pause();
                playPauseBtn.textContent = "▶ เล่นเพลง";
            }
        }

        function updatePlayPauseButton() {
            if (audio.paused) {
                playPauseBtn.textContent = "▶ เล่นเพลง";
            } else {
                playPauseBtn.textContent = "⏸ หยุดเพลง";
            }
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            audio.play();
            updatePlayPauseButton();
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            audio.play();
            updatePlayPauseButton();
        }

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration) {
                timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isSeekingSong) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = progressPercent + '%';
                timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            nextSong();
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function setSongPosition(e) {
            const rect = progressBarContainer.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clickPosition = (clientX - rect.left) / rect.width;
            clickPosition = Math.max(0, Math.min(1, clickPosition));

            if (audio.duration) {
                progressBar.style.width = (clickPosition * 100) + '%';
                timeDisplay.textContent = formatTime(clickPosition * audio.duration) + ' / ' + formatTime(audio.duration);
            }
            return clickPosition;
        }

        progressBarContainer.addEventListener('mousedown', (e) => {
            isSeekingSong = true;
            setSongPosition(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isSeekingSong) {
                setSongPosition(e);
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isSeekingSong) {
                isSeekingSong = false;
                const finalPos = setSongPosition(e);
                if (audio.duration) {
                    audio.currentTime = finalPos * audio.duration;
                }
            }
        });

        progressBarContainer.addEventListener('touchstart', (e) => {
            isSeekingSong = true;
            setSongPosition(e);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isSeekingSong) {
                setSongPosition(e);
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (isSeekingSong) {
                isSeekingSong = false;
                const rect = progressBarContainer.getBoundingClientRect();
                const touch = e.changedTouches[0];
                let clickPosition = (touch.clientX - rect.left) / rect.width;
                clickPosition = Math.max(0, Math.min(1, clickPosition));
                if (audio.duration) {
                    audio.currentTime = clickPosition * audio.duration;
                }
            }
        });

        // กำหนดรายการเพลงเตรียมไว้ แต่ยังไม่สั่งเล่นอัตโนมัติ (ให้เสียงบรรยายเล่นคนเดียว)
        playlistContainer.innerHTML = '';
        playlist.forEach((song, index) => {
            const item = document.createElement('div');
            item.className = `playlist-item ${index === currentSongIndex ? 'active-song' : ''}`;
            
            const songInfo = document.createElement('span');
            songInfo.style.flex = '1';
            songInfo.textContent = `${index + 1}. ${song.title}`;
            songInfo.onclick = () => {
                loadSong(index);
                audio.play();
                updatePlayPauseButton();
            };

            const dlBtn = document.createElement('button');
            dlBtn.className = 'song-dl-btn';
            dlBtn.innerHTML = '📥 ดาวน์โหลด';
            dlBtn.title = 'ดาวน์โหลดเพลงนี้';
            dlBtn.onclick = (e) => {
                e.stopPropagation();
                const a = document.createElement('a');
                a.href = song.src;
                a.download = song.src;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            item.appendChild(songInfo);
            item.appendChild(dlBtn);
            playlistContainer.appendChild(item);
        });
        currentSongTitle.textContent = `🎵 เพลงที่คุณร้อง (เลือกฟังด้านล่างได้เลย)`;


        // --- ระบบซูมภาพ (Zoom & Pan) ---
        let scale = 1;
        let pannedX = 0, pannedY = 0;
        let startX = 0, startY = 0;
        let isDragging = false;
        let initialDistance = null;

        slides.forEach(slide => {
            const img = slide.querySelector('img');
            if (!img) return;

            img.addEventListener('mousedown', (e) => {
                if (scale > 1) {
                    isDragging = true;
                    startX = e.clientX - pannedX;
                    startY = e.clientY - pannedY;
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                pannedX = e.clientX - startX;
                pannedY = e.clientY - startY;
                updateTransform(img);
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            img.addEventListener('dblclick', (e) => {
                if (scale === 1) {
                    scale = 2.5;
                } else {
                    scale = 1;
                    pannedX = 0;
                    pannedY = 0;
                }
                updateTransform(img);
            });

            img.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && scale > 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - pannedX;
                    startY = e.touches[0].clientY - pannedY;
                } else if (e.touches.length === 2) {
                    initialDistance = getHypot(e.touches[0], e.touches[1]);
                }
            }, { passive: true });

            img.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isDragging) {
                    pannedX = e.touches[0].clientX - startX;
                    pannedY = e.touches[0].clientY - startY;
                    updateTransform(img);
                } else if (e.touches.length === 2 && initialDistance) {
                    const currentDistance = getHypot(e.touches[0], e.touches[1]);
                    const zoomFactor = currentDistance / initialDistance;
                    scale = Math.min(Math.max(1, scale * (zoomFactor * 0.05 + 0.95)), 4);
                    initialDistance = currentDistance;
                    updateTransform(img);
                }
            }, { passive: true });

            img.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) initialDistance = null;
                if (e.touches.length === 0) isDragging = false;
            });
        });

        function getHypot(t1, t2) {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function updateTransform(img) {
            img.style.transform = `scale(${scale}) translate(${pannedX / scale}px, ${pannedY / scale}px)`;
        }

        updateSlide();
    </script>

</body>
</html>
