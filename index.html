<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fcf9f5;
            color: #4a4238;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* หน้าต่าง Tap to Start คลุมทับหน้าเว็บโปร่งใส */
        #welcomeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(74, 66, 56, 0.6); /* สีเทาเข้มโปร่งใส มองเห็นเว็บข้างหลังลางๆ */
            backdrop-filter: blur(4px); /* เบลอฉากหลังนิดหน่อยให้ดูละมุน */
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .welcome-card {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            width: 350px;
        }

        .welcome-card h2 {
            font-size: 18px;
            color: #4a4238;
            margin-bottom: 10px;
        }

        .welcome-card p {
            font-size: 13px;
            color: #8c7e6d;
            margin-bottom: 20px;
        }

        .start-btn {
            background: #a8937e;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            width: 100%;
        }

        .start-btn:hover {
            background: #957f6b;
            transform: scale(1.02);
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 30px;
            text-align: center;
            position: relative;
        }

        /* Voice Note Section */
        .voice-note-box {
            background: #f4efe6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .voice-title {
            font-size: 14px;
            color: #5c5042;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .voice-progress-container {
            width: 100%;
            height: 10px;
            background: #e8dcc4;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
            pointer-events: none; /* ตอนแรกยังไม่จบ จะห้ามคลิกเลื่อน */
            cursor: default;
        }

        .voice-progress-container.unlocked {
            pointer-events: auto;
            cursor: pointer;
        }

        .voice-progress-bar {
            width: 0%;
            height: 100%;
            background: #a8937e;
        }

        /* Audio Player Section (เครื่องเล่นเพลงด้านล่าง: ปิดไว้ก่อนตอนแรก) */
        .audio-player-box {
            background: #f4efe6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .audio-info {
            font-size: 14px;
            color: #5c5042;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #e8dcc4;
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 12px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #a8937e;
            pointer-events: none;
        }

        .audio-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .audio-btn {
            background: #e8dcc4;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.3s;
        }

        .audio-btn:hover {
            background: #dfcfb2;
        }

        /* Playlist Section */
        .playlist-box {
            margin-top: 15px;
            border-top: 1px solid #e8dcc4;
            padding-top: 12px;
            text-align: left;
        }

        .playlist-title {
            font-size: 13px;
            color: #7a6a56;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }

        .playlist-item:hover {
            background: #eae2d0;
        }

        .playlist-item.active-song {
            background: #e2d4bc;
            font-weight: 500;
        }

        .song-dl-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            color: #5c5042;
            border-radius: 4px;
        }

        .song-dl-btn:hover {
            background: #d4c4ac;
        }

        /* Slideshow Section with Zoom Capability */
        .slideshow-container {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
            margin-bottom: 15px;
            touch-action: none;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }

        .slide img:active {
            cursor: grabbing;
        }

        /* Download Button */
        .download-btn-container {
            margin-bottom: 20px;
        }

        .download-btn {
            background: #e8dcc4;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #dfcfb2;
        }

        /* Narrative Caption */
        .caption-box {
            min-height: 80px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
        }

        .caption-text {
            font-size: 16px;
            color: #6b5e50;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            flex: 1;
            background: #f4efe6;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: #e8dcc4;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Footer message */
        .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: #9c8e7e;
            border-top: 1px solid #f0ebe1;
            padding-top: 15px;
        }
    </style>
</head>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.getElementById('prevBtn');
        
        const captions = [
            "MUJI&COKO HAPPYBRITHDAY TO P'RENNIE",

            "ถ้าหากว่าชั้นคือเปลวไฟฟ", 
            "เธอก็คือสึนามิคลื่นลูกใหญ่เพราะชั้นก็ยังคงแพ้ให้เธอเหมือนเดิม",
            "SUNRISE WITH YOU",
            "ผู้หญิงที่สวยที่สุดในโลกและชีวิตเค้า",
            "ผึ้งที่น่ารักที่สุดในชีวิตเค้า",
            "THE BEST CARDGIFT TO THE BEST PERSON IN MY LIFE",
            "ของขวัญที่น่ารักๆจากเธอ",
            "คนที่น่ารักที่สุดในชีวิตเค้า",
            "THE PERSON WHO DESIGNED THE MOST BEAUTIFUL LIKE HER BEAUTY",
            "MASTER PIECES",
            "THE PUREST PERSON EVEN ONGANIC VEGETABLE STILL CAN'T FIGHT ",
            "คนที่น่ารักและสวยที่สุดไม่ว่าจะเป็นตอนไหนๆ",
            "คนที่สวยและน่ารักที่สุดในชีวิตของเค้า",
            "ฤดูที่เค้ารักที่สุดในชีวิตและอยากให้เป็นฤดูนี้ตลอดไป",
            "ขอโทษที่เป็นคนทำให้เสียใจนะมูจิและคนที่เค้ารักที่สุด",
            "คนที่เค้าอยากให้ดอกไม้มากที่สุดในชีวิต",
            "ของขวัญที่ดีที่สุดคือการได้มีชีวิตใกล้ๆคนที่ให้",
            "ถึงแม้จะไม่ใช้ของขวัญวันเกิดโดยตรงแต่เป็นรูปที่ดีใจมากหลังจากที่ทำให้เธอเสียใจ",
            "ขอโทษนะเมื่อก่อนคิดน้อยจริงๆ แค่กลัวว่าจะเสียเธอไป",
            "เล่นเกมสนุกเลยนะคับคุนกชพร คิดถึงนะคับ",
            "คนที่อยากเล่นด้วยทุกเกมที่มีในโลกนี้ มีคว่มสุขที่ได้เล่นเกมเพราะได้เล่นกับเธอ",
            "ยังไม่กล้าขอจับมือเลยขอโทษนะเธอ ขอบคุนที่มาช่วยนะ",
            "ชื่อจริงที่สวยที่สุดที่คิดถึงที่สุดในชีวิตเค้า",
            "ความทรงจำที่ดีที่สุดในชีวิตเค้าไม่ว่าจะตอนมีความสุขหรือมีน้ำตาและถึงเราจะไม่ได้มีบทสนทนาเค้าก็จะคุยกับเธอในฝัน ไปดูรูปสุดท้ายกันเลย",
            "คิดถึงนะถึงจะรู้ว่าเธอจะตอบยังไงก็ยังอยากพูด ขอโทดนะเธอ ไก่มาได้มั้บกลับมาได้มั้ยให้เค้าทำอะไรก็ยอมรู็ว่าเป็นไปได้ยากแต่เค้าอยู๋ตรงนี้ตลอดนะตลอดไป"
        ];

        const captionElement = document.getElementById('captionText');

        function resetZoom(img) {
            img.style.transform = "scale(1) translate(0px, 0px)";
            scale = 1;
            pannedX = 0;
            pannedY = 0;
        }

        function updateSlide() {
            slides.forEach((slide, index) => {
                const img = slide.querySelector('img');
                if (img) resetZoom(img);

                slide.classList.remove('active');
                if (index === currentSlide) {
                    slide.classList.add('active');
                }
            });

            captionElement.textContent = captions[currentSlide] || "";

            if (currentSlide === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide >= slides.length) {
                currentSlide = slides.length - 1;
            } else if (currentSlide < 0) {
                currentSlide = 0;
            }
            updateSlide();
        }

        function downloadCurrentPhoto() {
            const activeSlideImg = slides[currentSlide].querySelector('img');
            const imgSrc = activeSlideImg.src;
            
            const a = document.createElement('a');
            a.href = imgSrc;
            a.download = `Memory_${currentSlide}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // --- ฟังก์ชันกด Tap to Start เพื่อเปิดหน้าเว็บและเล่นเสียงบรรยายทันที ---
        const voiceNote = document.getElementById('voiceNote');
        const voiceProgressBar = document.getElementById('voiceProgressBar');
        const voiceProgressContainer = document.getElementById('voiceProgressContainer');
        const voiceTimeDisplay = document.getElementById('voiceTimeDisplay');
        const voiceTitleText = document.getElementById('voiceTitleText');
        const voiceStatusLabel = document.getElementById('voiceStatusLabel');
        const voicePlayPauseBtn = document.getElementById('voicePlayPauseBtn');
        let isVoiceUnlocked = false;
        let isSeekingVoice = false;

        function startExperience() {
            const overlay = document.getElementById('welcomeOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);

            // สั่งเล่นเสียงบรรยายทันทีหลังจากคลิกปุ่ม
            voiceNote.play().catch(e => {
                console.log("Audio play error:", e);
            });
        }

        function rewindVoice() {
            voiceNote.currentTime = Math.max(0, voiceNote.currentTime - 5);
        }

        function toggleVoicePlayPause() {
            if (!isVoiceUnlocked) return; 
            if (voiceNote.paused) {
                voiceNote.play();
                voicePlayPauseBtn.textContent = "⏸ STOP";
            } else {
                voiceNote.pause();
                voicePlayPauseBtn.textContent = "▶ PLAY";
            }
        }

        voiceNote.addEventListener('loadedmetadata', () => {
            if (voiceNote.duration) {
                voiceTimeDisplay.textContent = formatTime(0) + ' / ' + formatTime(voiceNote.duration);
            }
        });

        voiceNote.addEventListener('timeupdate', () => {
            if (voiceNote.duration && !isSeekingVoice) {
                const progressPercent = (voiceNote.currentTime / voiceNote.duration) * 100;
                voiceProgressBar.style.width = progressPercent + '%';
                voiceTimeDisplay.textContent = formatTime(voiceNote.currentTime) + ' / ' + formatTime(voiceNote.duration);
            }
        });

        // เมื่อเสียงบรรยายเล่นจบ! ทำการปลดล็อกทันที
        voiceNote.addEventListener('ended', () => {
            isVoiceUnlocked = true;
            voiceTitleText.textContent = "🎙️ ฟังจบแล้ว ขอบคุณนะ เผื่ออยากซ้ำนะะ";
            voiceStatusLabel.textContent = "ฟังจบแล้ว(เลื่อน/หยุดได้)";
            voiceProgressContainer.classList.add('unlocked');
            voicePlayPauseBtn.style.display = 'inline-block';
            voicePlayPauseBtn.textContent = "▶ ฟังอีกรอบ";
        });

        function setVoicePosition(e) {
            if (!isVoiceUnlocked) return 0;
            const rect = voiceProgressContainer.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clickPosition = (clientX - rect.left) / rect.width;
            clickPosition = Math.max(0, Math.min(1, clickPosition));

            if (voiceNote.duration) {
                voiceProgressBar.style.width = (clickPosition * 100) + '%';
                voiceTimeDisplay.textContent = formatTime(clickPosition * voiceNote.duration) + ' / ' + formatTime(voiceNote.duration);
            }
            return clickPosition;
        }

        voiceProgressContainer.addEventListener('mousedown', (e) => {
            if (!isVoiceUnlocked) return;
            isSeekingVoice = true;
            setVoicePosition(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isSeekingVoice) setVoicePosition(e);
        });

        window.addEventListener('mouseup', (e) => {
            if (isSeekingVoice) {
                isSeekingVoice = false;
                const finalPos = setVoicePosition(e);
                if (voiceNote.duration) {
                    voiceNote.currentTime = finalPos * voiceNote.duration;
                }
            }
        });


        // --- ระบบ Music Player & Playlist (ด้านล่าง: ปิดไว้ก่อนตอนแรก) ---
        const playlist = [
            { title: " THE MAN WHO CAN'T BE MOVED(ร้องสดเพราะกว่า(แหละะ))", src: "music1.mp3" },
            { title: "คนทางนั้น(ร้องสดเพราะกว่า(แหละะ))", src: "music2.mp3" },
            { title: "ALICE(ร้องสดเพราะกว่า(แหละะ))", src: "music3.mp3" },
            { title: "REBORN(ร้องสดเพราะกว่า(แหละะ))", src: "music4.mp3" },
            { title: "พูดไม่คิด(ร้องสดเพราะกว่า(แหละะ))", src: "music5.mp3" }
        ];

        let currentSongIndex = 0;
        const audio = document.getElementById('bgVoice');
        const progressBar = document.getElementById('progressBar');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        const currentSongTitle = document.getElementById('currentSongTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playlistContainer = document.getElementById('playlistContainer');
        let isSeekingSong = false;

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentSongIndex ? 'active-song' : ''}`;
                
                const songInfo = document.createElement('span');
                songInfo.style.flex = '1';
                songInfo.textContent = `${index + 1}. ${song.title}`;
                songInfo.onclick = () => {
                    loadSong(index);
                    audio.play();
                    updatePlayPauseButton();
                };

                const dlBtn = document.createElement('button');
                dlBtn.className = 'song-dl-btn';
                dlBtn.innerHTML = '📥 DOWNLOAD';
                dlBtn.title = 'DOWNLOAD THIS SONG';
                dlBtn.onclick = (e) => {
                    e.stopPropagation();
                    const a = document.createElement('a');
                    a.href = song.src;
                    a.download = song.src;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                item.appendChild(songInfo);
                item.appendChild(dlBtn);
                playlistContainer.appendChild(item);
            });
        }

        function loadSong(index) {
            currentSongIndex = index;
            audio.src = playlist[currentSongIndex].src;
            currentSongTitle.textContent = `🎵 SONG: ${playlist[currentSongIndex].title}`;
            renderPlaylist();
        }

        function togglePlayPause() {
            if (audio.paused) {
                if (!audio.src || audio.src === window.location.href) {
                    loadSong(0);
                }
                audio.play().catch(e => console.log("Play blocked"));
                playPauseBtn.textContent = "⏸ STOP";
            } else {
                audio.pause();
                playPauseBtn.textContent = "▶ PLAY";
            }
        }

        function updatePlayPauseButton() {
            if (audio.paused) {
                playPauseBtn.textContent = "▶ PLAY";
            } else {
                playPauseBtn.textContent = "⏸ STOP";
            }
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            audio.play();
            updatePlayPauseButton();
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            audio.play();
            updatePlayPauseButton();
        }

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration) {
                timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isSeekingSong) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = progressPercent + '%';
                timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            nextSong();
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function setSongPosition(e) {
            const rect = progressBarContainer.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clickPosition = (clientX - rect.left) / rect.width;
            clickPosition = Math.max(0, Math.min(1, clickPosition));

            if (audio.duration) {
                progressBar.style.width = (clickPosition * 100) + '%';
                timeDisplay.textContent = formatTime(clickPosition * audio.duration) + ' / ' + formatTime(audio.duration);
            }
            return clickPosition;
        }

        progressBarContainer.addEventListener('mousedown', (e) => {
            isSeekingSong = true;
            setSongPosition(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isSeekingSong) setSongPosition(e);
        });

        window.addEventListener('mouseup', (e) => {
            if (isSeekingSong) {
                isSeekingSong = false;
                const finalPos = setSongPosition(e);
                if (audio.duration) {
                    audio.currentTime = finalPos * audio.duration;
                }
            }
        });

        progressBarContainer.addEventListener('touchstart', (e) => {
            isSeekingSong = true;
            setSongPosition(e);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isSeekingSong) setSongPosition(e);
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (isSeekingSong) {
                isSeekingSong = false;
                const rect = progressBarContainer.getBoundingClientRect();
                const touch = e.changedTouches[0];
                let clickPosition = (touch.clientX - rect.left) / rect.width;
                clickPosition = Math.max(0, Math.min(1, clickPosition));
                if (audio.duration) {
                    audio.currentTime = clickPosition * audio.duration;
                }
            }
        });

        renderPlaylist();
        currentSongTitle.textContent = `🎵 RENNIE LIST 🤍​🌧️​`;


        // --- ระบบซูมภาพ (Zoom & Pan) ---
        let scale = 1;
        let pannedX = 0, pannedY = 0;
        let startX = 0, startY = 0;
        let isDragging = false;
        let initialDistance = null;

        slides.forEach(slide => {
            const img = slide.querySelector('img');
            if (!img) return;

            img.addEventListener('mousedown', (e) => {
                if (scale > 1) {
                    isDragging = true;
                    startX = e.clientX - pannedX;
                    startY = e.clientY - pannedY;
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                pannedX = e.clientX - startX;
                pannedY = e.clientY - startY;
                updateTransform(img);
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            img.addEventListener('dblclick', (e) => {
                if (scale === 1) {
                    scale = 2.5;
                } else {
                    scale = 1;
                    pannedX = 0;
                    pannedY = 0;
                }
                updateTransform(img);
            });

            img.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && scale > 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - pannedX;
                    startY = e.touches[0].clientY - pannedY;
                } else if (e.touches.length === 2) {
                    initialDistance = getHypot(e.touches[0], e.touches[1]);
                }
            }, { passive: true });

            img.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isDragging) {
                    pannedX = e.touches[0].clientX - startX;
                    pannedY = e.touches[0].clientY - startY;
                    updateTransform(img);
                } else if (e.touches.length === 2 && initialDistance) {
                    const currentDistance = getHypot(e.touches[0], e.touches[1]);
                    const zoomFactor = currentDistance / initialDistance;
                    scale = Math.min(Math.max(1, scale * (zoomFactor * 0.05 + 0.95)), 4);
                    initialDistance = currentDistance;
                    updateTransform(img);
                }
            }, { passive: true });

            img.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) initialDistance = null;
                if (e.touches.length === 0) isDragging = false;
            });
        });

        function getHypot(t1, t2) {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function updateTransform(img) {
            img.style.transform = `scale(${scale}) translate(${pannedX / scale}px, ${pannedY / scale}px)`;
        }

        updateSlide();
    </script>

</body>
