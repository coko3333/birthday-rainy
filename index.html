<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Rainy</title>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fcf9f5;
            color: #4a4238;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 30px;
            text-align: center;
            position: relative;
        }

        /* Music Control Button */
        .music-btn {
            background: #e8dcc4;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            color: #5c5042;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .music-btn:hover {
            background: #dfcfb2;
        }

        /* Slideshow Section */
        .slideshow-container {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 12px;
            overflow: hidden;
            background: #f0ebe1;
            margin-bottom: 20px;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ปรับเป็น contain เพื่อไม่ให้รูปโดนตัดขอบ */
            background-color: #1a1a1a;
        }

        /* Narrative Caption */
        .caption-box {
            min-height: 80px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
        }

        .caption-text {
            font-size: 16px;
            color: #6b5e50;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            flex: 1;
            background: #f4efe6;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            color: #5c5042;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #e8dcc4;
        }

        /* Footer message */
        .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: #9c8e7e;
            border-top: 1px solid #f0ebe1;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ปุ่มเปิด/ปิดเพลงประกอบ -->
        <button class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">🎵 เปิดเพลงประกอบ</button>

        <!-- พื้นที่แสดงรูปภาพสไลด์โชว์ (รองรับ pic0 ถึง pic32) -->
        <div class="slideshow-container" id="slideshow">
            <div class="slide active"><img src="pic0.jpg" alt="Memory 0"></div>
            <div class="slide"><img src="pic1.jpg" alt="Memory 1"></div>
            <div class="slide"><img src="pic2.jpg" alt="Memory 2"></div>
            <div class="slide"><img src="pic3.jpg" alt="Memory 3"></div>
            <div class="slide"><img src="pic4.jpg" alt="Memory 4"></div>
            <div class="slide"><img src="pic5.jpg" alt="Memory 5"></div>
            <div class="slide"><img src="pic6.jpg" alt="Memory 6"></div>
            <div class="slide"><img src="pic7.jpg" alt="Memory 7"></div>
            <div class="slide"><img src="pic8.jpg" alt="Memory 8"></div>
            <div class="slide"><img src="pic9.jpg" alt="Memory 9"></div>
            <div class="slide"><img src="pic10.jpg" alt="Memory 10"></div>
            <div class="slide"><img src="pic11.jpg" alt="Memory 11"></div>
            <div class="slide"><img src="pic12.jpg" alt="Memory 12"></div>
            <div class="slide"><img src="pic13.jpg" alt="Memory 13"></div>
            <div class="slide"><img src="pic14.jpg" alt="Memory 14"></div>
            <div class="slide"><img src="pic15.jpg" alt="Memory 15"></div>
            <div class="slide"><img src="pic16.jpg" alt="Memory 16"></div>
            <div class="slide"><img src="pic17.jpg" alt="Memory 17"></div>
            <div class="slide"><img src="pic18.jpg" alt="Memory 18"></div>
            <div class="slide"><img src="pic19.jpg" alt="Memory 19"></div>
            <div class="slide"><img src="pic20.jpg" alt="Memory 20"></div>
            <div class="slide"><img src="pic21.jpg" alt="Memory 21"></div>
            <div class="slide"><img src="pic22.jpg" alt="Memory 22"></div>
            <div class="slide"><img src="pic23.jpg" alt="Memory 23"></div>
            <div class="slide"><img src="pic24.jpg" alt="Memory 24"></div>
            <div class="slide"><img src="pic25.jpg" alt="Memory 25"></div>
            <div class="slide"><img src="pic26.jpg" alt="Memory 26"></div>
            <div class="slide"><img src="pic27.jpg" alt="Memory 27"></div>
            <div class="slide"><img src="pic28.jpg" alt="Memory 28"></div>
            <div class="slide"><img src="pic29.jpg" alt="Memory 29"></div>
            <div class="slide"><img src="pic30.jpg" alt="Memory 30"></div>
            <div class="slide"><img src="pic31.jpg" alt="Memory 31"></div>
            <div class="slide"><img src="pic32.jpg" alt="Memory 32"></div>
        </div>

        <!-- กล่องข้อความบรรยายความรู้สึก (จะเปลี่ยนตามรูป) -->
        <div class="caption-box">
            <p class="caption-text" id="captionText">สุขสันต์วันเกิดนะเรนนี่... ขอบคุณสำหรับทุกความทรงจำที่ดีตลอดมา</p>
        </div>

        <!-- ปุ่มกดเปลี่ยนรูป -->
        <div class="nav-buttons">
            <button class="btn" onclick="changeSlide(-1)">◀ รูปก่อนหน้า</button>
            <button class="btn" onclick="changeSlide(1)">รูปถัดไป ▶</button>
        </div>

        <div class="footer-note">
            HBD Rainy • Wishing you all the best and genuine happiness.
        </div>
    </div>

    <!-- ไฟล์เพลงประกอบ (ใส่ชื่อไฟล์เพลงของคุณตรง src) -->
    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mp3">
    </audio>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        
        // ข้อความบรรยายในแต่ละรูป (คุณสามารถแก้ไขข้อความในเครื่องหมายคำพูดแต่ละอันได้ตามใจชอบเลยครับ)
        const captions = [
            "สุขสันต์วันเกิดนะเรนนี่... ขอบคุณสำหรับทุกความทรงจำที่ดีตลอดมา",
            "ทุกเรื่องราวที่เราเคยมีร่วมกัน ยังคงเป็นความประทับใจในใจเสมอ",
            "ไม่ว่าเวลาจะผ่านไปนานแค่ไหน เรื่องราวเหล่านี้ก็ยังมีค่าเสมอ",
            "ขอให้เธอมีความสุขมากๆ ในทุกๆ วันและทุกเส้นทางที่เดินไป",
            "ขอให้เป็นปีที่ดีและเต็มไปด้วยรอยยิ้มนะ",
            "ภาพความทรงจำที่เราเคยเติบโตมาด้วยกัน...",
            "รอยยิ้มและเสียงหัวเราะในวันนั้น...",
            "ขอบคุณที่เคย 3 ปี 5 เดือนที่ผ่านมา ที่ทำให้ได้เรียนรู้หลายๆ อย่าง",
            "ไม่ว่าจะเกิดอะไรขึ้น เธอก็ยังคงเป็นความทรงจำที่สวยงาม",
            "ขอให้เธอประสบความสำเร็จในสิ่งที่ฝันไว้นะ",
            // (คุณสามารถพิมพ์ข้อความเพิ่มหรือแก้ตรงนี้ให้ตรงกับรูป pic10 - pic32 ได้เลยครับ ถ้าไม่แก้ระบบจะใช้ข้อความวนซ้ำอัตโนมัติ)
        ];

        const captionElement = document.getElementById('captionText');

        function updateSlide() {
            slides.forEach((slide, index) => {
                slide.classList.remove('active');
                if (index === currentSlide) {
                    slide.classList.add('active');
                }
            });
            // ถ้ามีข้อความใน captions จะแสดงตามนั้น ถ้าหมดจะใช้ข้อความสำรอง
            captionElement.textContent = captions[currentSlide] || "สุขสันต์วันเกิดนะเรนนี่ ขอให้มีความสุขมากๆ ในทุกๆ วัน";
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide >= slides.length) {
                currentSlide = 0;
            } else if (currentSlide < 0) {
                currentSlide = slides.length - 1;
            }
            updateSlide();
        }

        // ระบบควบคุมเพลง
        let isPlaying = false;
        function toggleMusic() {
            const btn = document.getElementById('musicToggleBtn');
            const audio = document.getElementById('bgMusic');
            
            isPlaying = !isPlaying;
            if (isPlaying) {
                btn.textContent = "⏸ ปิดเพลงประกอบ";
                audio.play();
            } else {
                btn.textContent = "🎵 เปิดเพลงประกอบ";
                audio.pause();
            }
        }
    </script>

</body>
</html>
